version: '3.8'

services:
  # 1. Dịch vụ Cơ sở Dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: tunetext_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-tunetext_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tunetext_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Dịch vụ Monolith Fullstack (FastAPI Backend + Frontend Web UI)
  api:
    build: .
    container_name: tunetext_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-tunetext_db}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_please_change_in_production_1234567890}
      - ENVIRONMENT=production
      - API_V1_PREFIX=/api/v1
    ports:
      - "8000:8000"

  # 3. Dịch vụ Cloudflare Tunnel (Tùy chọn: Chạy khi có token)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tunetext_cloudflared
    restart: always
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    profiles:
      - tunnel

volumes:
  pgdata:
    driver: local
